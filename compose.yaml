services:
  optic:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - optic-data:/app/data
      - ./config.json:/app/config.json:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  optic-data:
